server.address=127.0.0.1
server.port=8787
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=17MB
spring.datasource.url=jdbc:sqlite:${INVENTORY_DB:data/inventory.db}
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
inventory.admin-password=${INVENTORY_ADMIN_PASSWORD:}
