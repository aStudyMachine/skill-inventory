[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-inventory-client"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["keyring>=25,<27"]

[project.scripts]
skill-inventory = "skill_inventory.cli:main"

[project.gui-scripts]
skill-inventory-gui = "skill_inventory.gui:main"
